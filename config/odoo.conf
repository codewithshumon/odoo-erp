[options]
; Admin password for database manager (CHANGE THIS!)
admin_passwd = admin

; Database connection settings
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

; Default database to use (will be created on first run if not exists)
; Leave empty to use the database selector on first start
db_name = smartbiz

; Addons paths - core addons + your custom modules
addons_path = /opt/odoo/addons, /mnt/extra-addons

; Filestore (attachments) location
data_dir = /var/lib/odoo/.local/share/Odoo

; HTTP & Longpolling ports
http_port = 8069
longpolling_port = 8072

; Logging
logfile = /var/log/odoo/odoo.log
log_level = info
log_handler = [":INFO"]

; Development mode - auto-reload on Python/XML changes
; Remove or comment out in production
dev = reload

; Workers - 0 means single-process (good for development)
workers = 0

; Max CSV import limit
import_partial =

; Email settings (uncomment and configure when needed)
; email_from = odoo@example.com
; smtp_server = smtp.example.com
; smtp_port = 587
; smtp_user =
; smtp_password =
; smtp_ssl = True

; Session & security
limit_time_cpu = 600
limit_time_real = 1200
max_cron_threads = 2

; Proxy mode - enable if running behind a reverse proxy
; proxy_mode = True

; List of databases to show in the database selector (empty = all)
; dbfilter = ^smartbiz$

; Language
; default_productivity_apps = True
; load_language = en_US
; language = en_US